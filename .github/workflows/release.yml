name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Release version: $version"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run tests
        run: dotnet test VoltManager.sln -c Release -v q --nologo

      - name: Publish (self-contained win-x64)
        run: >
          dotnet publish src/VoltManager/VoltManager.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -p:Version=${{ steps.ver.outputs.version }}
          -p:AssemblyVersion=${{ steps.ver.outputs.version }}.0
          -p:FileVersion=${{ steps.ver.outputs.version }}.0
          -o publish

      - name: Download WebView2 bootstrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src/VoltManager.Setup/Payload | Out-Null
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' `
            -OutFile 'src/VoltManager.Setup/Payload/MicrosoftEdgeWebview2Setup.exe'

      - name: Copy icon to Setup project
        shell: pwsh
        run: |
          Copy-Item src/VoltManager/Assets/voltmanager.ico src/VoltManager.Setup/voltmanager.ico -Force

      - name: Zip publish folder into payload
        shell: pwsh
        run: |
          Add-Type -Assembly 'System.IO.Compression.FileSystem'
          [IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path 'publish').Path,
            (Join-Path (Resolve-Path 'src/VoltManager.Setup/Payload').Path 'payload.zip'),
            [IO.Compression.CompressionLevel]::Optimal, $false)

      - name: Build Setup project
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          dotnet build src/VoltManager.Setup/VoltManager.Setup.csproj `
            -c Release `
            -p:Platform=x64 `
            -p:Version=${{ steps.ver.outputs.version }} `
            -p:AssemblyVersion=${{ steps.ver.outputs.version }}.0 `
            -p:FileVersion=${{ steps.ver.outputs.version }}.0 `
            -o dist/setup-build
          Copy-Item dist/setup-build/VoltManagerSetup.exe `
            dist/VoltManagerSetup-${{ steps.ver.outputs.version }}.exe -Force
          Get-ChildItem dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: VoltManager v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: dist/VoltManagerSetup-${{ steps.ver.outputs.version }}.exe
