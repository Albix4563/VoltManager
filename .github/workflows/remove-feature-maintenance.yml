name: Remove deprecated cooling feature

on:
  push:
    branches:
      - remove-fans-cooling

permissions:
  contents: write

jobs:
  remove-feature:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-fans-cooling
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply removal
        shell: pwsh
        run: |
          python scripts/remove-fans-cooling.py
          python scripts/remove-fans-residuals.py

      - name: Check residual feature references
        shell: pwsh
        run: |
          git grep -n -i -P '\bfans?\b|\bcooling\b|ventol|raffredd' -- ':!LICENSE' ':!scripts/remove-fans-cooling.py' ':!scripts/remove-fans-residuals.py' ':!.github/workflows/remove-feature-maintenance.yml'
          $code = $LASTEXITCODE
          if ($code -eq 0) { throw 'Residual fan/cooling references remain.' }
          if ($code -ne 1) { exit $code }
          Write-Host 'No fan/cooling feature references remain.'
          exit 0

      - name: Restore
        run: dotnet restore VoltManager.sln

      - name: Build
        run: dotnet build VoltManager.sln -c Release --no-restore -v:minimal

      - name: Test .NET
        run: dotnet test tests/VoltManager.Tests/VoltManager.Tests.csproj -c Release --no-build --no-restore -v:minimal

      - name: Test JavaScript
        run: node --test tests/*.test.mjs

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem src/VoltManager/wwwroot/js/*.js) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Package smoke test
        shell: pwsh
        run: .\build.ps1 -SkipTests -SkipInstaller

      - name: Commit verified removal
        shell: pwsh
        run: |
          Remove-Item scripts/remove-fans-cooling.py
          Remove-Item scripts/remove-fans-residuals.py
          Remove-Item .github/workflows/remove-feature-maintenance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: remove fans and cooling subsystem'
          git push origin HEAD:remove-fans-cooling
