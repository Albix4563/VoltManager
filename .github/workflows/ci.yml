name: CI

on:
  pull_request:
    branches: [main, Preview, Dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore VoltManager.sln

      - name: Build
        run: dotnet build VoltManager.sln -c Release --no-restore

      - name: Test reliability scenarios
        run: dotnet test tests/VoltManager.Tests/VoltManager.Tests.csproj -c Release --no-build --logger "trx;LogFileName=reliability.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn
