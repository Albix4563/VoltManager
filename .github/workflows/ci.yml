name: CI

on:
  workflow_call:
  pull_request:
    branches: [main, Preview, Dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore VoltManager.sln

      - name: Build and type check
        shell: pwsh
        run: |
          & dotnet build VoltManager.sln -c Release --no-restore -v:minimal 2>&1 |
            Tee-Object -FilePath build.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Run .NET regression tests
        run: >
          dotnet test tests/VoltManager.Tests/VoltManager.Tests.csproj
          -c Release --no-build --no-restore -v:minimal
          --logger "trx;LogFileName=voltmanager-tests.trx"
          --results-directory TestResults/dotnet

      - name: Run setup regression tests
        run: >
          dotnet test tests/VoltManager.Setup.Tests/VoltManager.Setup.Tests.csproj
          -c Release --no-build --no-restore -v:minimal
          --logger "trx;LogFileName=setup-tests.trx"
          --results-directory TestResults/dotnet

      - name: Run deterministic resource validation
        run: dotnet run --project tests/VoltManager.WindowsHarness/VoltManager.WindowsHarness.csproj -c Release --no-build -- --mode deterministic --output TestResults/resource-validation

      - name: Run WebView2 UI smoke
        run: dotnet run --project tests/VoltManager.WindowsHarness/VoltManager.WindowsHarness.csproj -c Release --no-build -- --mode ui-smoke --output TestResults/ui-smoke

      - name: Run JavaScript regression tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force TestResults | Out-Null
          & node --test tests/*.test.mjs "tests/web/**/*.test.js" 2>&1 |
            Tee-Object -FilePath TestResults/node-tests.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force TestResults | Out-Null
          $log = 'TestResults/js-syntax.log'
          foreach ($file in Get-ChildItem src/VoltManager/wwwroot/js -Recurse -Filter *.js -File) {
            "Checking $($file.FullName)" | Tee-Object -FilePath $log -Append
            & node --check $file.FullName 2>&1 |
              Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Package portable smoke test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force TestResults | Out-Null
          & .\build.ps1 -SkipInstaller 2>&1 |
            Tee-Object -FilePath TestResults/package-smoke.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-diagnostics
          path: |
            build.log
            TestResults/**
          if-no-files-found: warn
